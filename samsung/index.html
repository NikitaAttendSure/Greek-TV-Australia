<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greek One · Samsung TV</title>
<style>
:root{font-family:Arial,sans-serif;color:#fff;background:#090f1d}*{box-sizing:border-box}body{margin:0;padding:4vw;background:radial-gradient(circle at 75% 0%,#1d3c65,#090f1d 65%);min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5vh}.brand{font-weight:900;font-size:clamp(28px,4vw,58px);letter-spacing:-2px}.brand span{color:#49b6ff}.tag{color:#a7bbd2;font-size:clamp(14px,1.4vw,23px)}h1{font-size:clamp(30px,4vw,60px);margin:0 0 12px}p{color:#bac7da;font-size:clamp(17px,1.8vw,27px)}nav{display:flex;gap:1.2vw;flex-wrap:wrap;margin:4vh 0}button{cursor:pointer;color:white;background:#172942;border:2px solid #34516f;border-radius:14px;padding:1.3vw 2vw;font-size:clamp(17px,1.8vw,28px)}button:focus{outline:4px solid #56b9ff;background:#245a90;transform:scale(1.03)}button[aria-selected=true]{background:#1e609b}.panel{background:#132139bd;border:1px solid #34516f;border-radius:20px;padding:3vw;min-height:30vh}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.item{text-align:left;min-height:120px}video{width:100%;max-height:70vh;background:#000}#status{color:#ffcf83}footer{color:#8295af;margin-top:5vh;font-size:16px}
button{transition:background .15s,transform .15s;box-shadow:0 8px 26px #0003}button:hover{background:#24466b}.panel{box-shadow:0 22px 70px #0006}#heading{font-size:clamp(25px,2.7vw,44px)}.item{position:relative;overflow:hidden;min-height:220px;display:flex;align-items:end;justify-content:start;font-weight:bold;text-shadow:0 2px 6px #000;background-size:cover;background-position:center}.item::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#07101fdc);pointer-events:none}.item .name{position:relative;z-index:1}#player:fullscreen{width:100%;height:100%;max-height:none}#status{min-height:2em}@media(max-width:700px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.item{min-height:160px}body{padding:5vw}}
</style></head><body><header><div class="brand">GREEK <span>ONE</span></div><div class="tag">Greek entertainment · Samsung Edition</div></header>
<h1>Η Ελλάδα στην οθόνη σου.</h1><p>Your home for Greek television, cinema and entertainment.</p>
<nav id="tabs"><button aria-selected="true" data-section="live">Live TV</button><button data-section="movies">Movies</button><button data-section="series">TV Series</button><button data-section="cooking">Cooking Shows</button></nav>
<main class="panel"><h2 id="heading">Live TV</h2><p id="status">Loading catalogue…</p><div id="items" class="items"></div><video id="player" controls playsinline hidden></video></main>
<footer>Use the arrow keys and OK/Enter on your Samsung remote. Back returns to the catalogue.</footer>
<script>
const sections={live:'Live TV',movies:'Movies',series:'TV Series',cooking:'Cooking Shows'};let catalog={live:[],movies:[],series:[],cooking:[]};let current='live';const items=document.getElementById('items'),status=document.getElementById('status'),player=document.getElementById('player');
function render(){document.getElementById('heading').textContent=sections[current];document.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.section===current)));items.replaceChildren();player.pause();player.removeAttribute('src');player.hidden=true;const entries=catalog[current]||[];status.textContent=entries.length?'Select a title to play.':'No verified streams have been configured for this category yet.';entries.forEach(entry=>{if(!entry.title||!entry.url)return;const b=document.createElement('button');b.className='item';const name=document.createElement('span');name.className='name';name.textContent=entry.title;b.appendChild(name);if(entry.poster&&/^https:\/\//.test(entry.poster)){b.style.backgroundImage='url("'+encodeURI(entry.poster).replace(/"/g,'%22')+'")'}b.onclick=()=>play(entry);items.appendChild(b)})}
function play(entry){status.textContent='Opening '+entry.title;items.replaceChildren();player.hidden=false;player.src=entry.url;player.play().catch(()=>{status.textContent='Playback unavailable. Press play on the video controls, or choose another title.'})}
player.addEventListener('error',()=>{status.textContent='This video could not be played on this Samsung browser.'});document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{current=b.dataset.section;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'||e.key==='BrowserBack'){e.preventDefault();render()}});
fetch('./catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog unavailable');return r.json()}).then(data=>{for(const key of Object.keys(sections))if(Array.isArray(data[key]))catalog[key]=data[key];render()}).catch(()=>{render();status.textContent='Catalogue not connected yet. Samsung interface preview only.'});
</script></body></html>
