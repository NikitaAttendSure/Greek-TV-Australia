name: Inspect SKAI viewer markup (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/skai-view-research.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect SKAI public episode page sections only
        run: |
          python3 - <<'PY'
          import urllib.request,re
          url='https://www.skai.gr/tv/episode/seires/mple-ores/2026-10-16-21'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36'})
          with urllib.request.urlopen(req,timeout=15) as r: html=r.read(1000000).decode('utf8','replace')
          print('STATUS OK; LEN',len(html))
          for term in ['<div class="livebox"','id="kkk"','id="player-main"','cookie','consent','gdpr','privacy','phaistos','getElementById(\'player-main\')','checkGeolocation']:
            hits=list(re.finditer(re.escape(term),html,re.I))
            print('TERM',term,'COUNT',len(hits))
            for m in hits[:2]:
              sample=html[max(0,m.start()-380):m.start()+1300]
              sample=re.sub(r'(?i)(token|signature|auth|key)=[^&\s"\']+',r'\1=REDACTED',sample)
              print('SNIP',re.sub(r'\s+',' ',sample)[:1400])
          PY
