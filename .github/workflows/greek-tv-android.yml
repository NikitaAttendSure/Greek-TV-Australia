name: Build Greek TV APK
# permanent-signing-enabled
on:
  pull_request:
    paths:
      - 'tv-app/**'
      - '.github/workflows/greek-tv-android.yml'
  push:
    paths:
      - 'tv-app/**'
      - '.github/workflows/greek-tv-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: greek-tv-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tv-app
    env:
      RESKAKIS_KEYSTORE_B64: ${{ secrets.RESKAKIS_KEYSTORE_B64 }}
      RESKAKIS_KEYSTORE_PASSWORD: ${{ secrets.RESKAKIS_KEYSTORE_PASSWORD }}
      PAPAS_KEYSTORE_B64: ${{ secrets.PAPAS_KEYSTORE_B64 }}
      PAPAS_KEYSTORE_PASSWORD: ${{ secrets.PAPAS_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug variants
        run: gradle --no-daemon --stacktrace --info assembleReskakisDebug assemblePappasDebug

      - name: Prepare permanent signing keys
        if: env.RESKAKIS_KEYSTORE_B64 != '' && env.PAPAS_KEYSTORE_B64 != ''
        working-directory: .
        run: |
          echo "$RESKAKIS_KEYSTORE_B64" | base64 --decode > /tmp/reskakis-tv-release.jks
          echo "$PAPAS_KEYSTORE_B64" | base64 --decode > /tmp/papas-tv-release.jks
          chmod 600 /tmp/reskakis-tv-release.jks /tmp/papas-tv-release.jks

      - name: Build signed release variants
        if: env.RESKAKIS_KEYSTORE_B64 != '' && env.PAPAS_KEYSTORE_B64 != ''
        env:
          RESKAKIS_KEYSTORE_PATH: /tmp/reskakis-tv-release.jks
          PAPAS_KEYSTORE_PATH: /tmp/papas-tv-release.jks
        run: gradle --no-daemon --stacktrace --info assembleReskakisRelease assemblePappasRelease

      - name: Build separate signed Greek One test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/greek-one-ble-ores-integrated-build67' && github.event.pull_request.head.repo.full_name == github.repository && env.RESKAKIS_KEYSTORE_B64 != ''
        env:
          RESKAKIS_KEYSTORE_PATH: /tmp/reskakis-tv-release.jks
          PAPAS_KEYSTORE_PATH: /tmp/papas-tv-release.jks
        run: gradle --no-daemon --stacktrace assembleBleorestestRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TV-builds
          if-no-files-found: ignore
          path: |
            tv-app/app/build/outputs/apk/reskakis/debug/app-reskakis-debug.apk
            tv-app/app/build/outputs/apk/pappas/debug/app-pappas-debug.apk
            tv-app/app/build/outputs/apk/reskakis/release/app-reskakis-release.apk
            tv-app/app/build/outputs/apk/pappas/release/app-pappas-release.apk
            tv-app/app/build/outputs/apk/bleorestest/release/app-bleorestest-release.apk


      - name: Publish isolated Greek One BLE ORES test package
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/greek-one-ble-ores-integrated-build67' && github.event.pull_request.head.repo.full_name == github.repository && env.RESKAKIS_KEYSTORE_B64 != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view greek-one-ble-ores-test-build67 >/dev/null 2>&1; then
            gh release create greek-one-ble-ores-test-build67 --target "$GITHUB_HEAD_REF" --prerelease --title "Greek One Test: Μπλε Ώρες" --notes "Isolated TV test app. Separate package; does NOT update or replace regular Greek One. Playback on physical Sony remains unverified."
          fi
          cp tv-app/app/build/outputs/apk/bleorestest/release/app-bleorestest-release.apk GREEK-ONE-BLE-ORES-TEST.apk
          gh release upload greek-one-ble-ores-test-build67 GREEK-ONE-BLE-ORES-TEST.apk --clobber

      - name: Publish permanent signed TV APKs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.RESKAKIS_KEYSTORE_B64 != '' && env.PAPAS_KEYSTORE_B64 != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view reskakis-tv-latest >/dev/null 2>&1; then
            gh release create reskakis-tv-latest --title "RESKAKIS TV" --notes "Latest signed Sony / Google TV family build."
          fi
          cp tv-app/app/build/outputs/apk/reskakis/release/app-reskakis-release.apk RESKAKIS-TV.apk
          gh release upload reskakis-tv-latest RESKAKIS-TV.apk --clobber

          if ! gh release view pappas-tv-latest >/dev/null 2>&1; then
            gh release create pappas-tv-latest --title "PAPAS TV" --notes "Latest signed Sony / Google TV family build."
          fi
          cp tv-app/app/build/outputs/apk/pappas/release/app-pappas-release.apk PAPAS-TV.apk
          gh release upload pappas-tv-latest PAPAS-TV.apk --clobber
