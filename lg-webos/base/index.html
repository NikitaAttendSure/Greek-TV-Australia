<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Greek TV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="hero"></div><div id="veil"></div>
  <header>
    <div class="brand"><div class="flag">🇬🇷</div><div><h1 id="brandName">GREEK TV</h1><p id="sub">GREEK TELEVISION</p></div></div>
    <div id="tagline"></div><div id="clock"></div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="playerScreen" class="hidden">
  <video id="video" autoplay controls></video>
  <div id="playerBar"><span id="liveBadge">LIVE</span><span id="playerTitle"></span></div>
</div>
<script src="brand.js"></script>
<script src="app.js"></script>
</body>
</html>
