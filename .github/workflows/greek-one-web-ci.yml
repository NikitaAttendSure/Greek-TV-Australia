name: Greek One Web regressions
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/greek-one-web-ci.yml'
  push:
    branches: [greek-one-web]
    paths:
      - 'web/**'
      - '.github/workflows/greek-one-web-ci.yml'
permissions:
  contents: read
jobs:
  web-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/server.js
          node --check web/skai-series.js
          node --check web/tests/check.js
      - name: Test episode parser
        run: node web/tests/check.js
      - name: Inspect live SKAI episode index (non-blocking external dependency)
        continue-on-error: true
        run: |
          node - <<'JS'
          const {listEpisodes}=require("./web/skai-series");
          listEpisodes().then(episodes=>{
            console.log("SKAI episodes discovered:",episodes.length);
            console.log("Episode numbers:",episodes.map(x=>x.number).slice(0,40).join(", "));
            if(!episodes.length)throw Error("No episodes returned");
            if(!episodes.every(x=>x.url.startsWith("https://www.skai.gr/tv/episode/seires/mple-ores/")))throw Error("Episode source mismatch");
          }).catch(e=>{console.error("SKAI source check:",e.message);process.exitCode=1;});
          JS
      - name: Exercise Greek One local web server
        run: |
          PORT=3999 node web/server.js &
          serverpid=$!
          trap 'kill "$serverpid" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS --max-time 8 http://127.0.0.1:3999/ -o /tmp/greek-one-index.html
          grep -q 'GREEK ONE' /tmp/greek-one-index.html
          curl -fsS --max-time 8 http://127.0.0.1:3999/app.js -o /tmp/greek-one-app.js
          grep -q 'showBleOresDetail' /tmp/greek-one-app.js
      - name: Install headless browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Greek One desktop and mobile browsers
        run: |
          PORT=3999 node web/server.js &
          serverpid=$!
          trap 'kill "$serverpid" 2>/dev/null || true' EXIT
          sleep 2
          node web/tests/browser-smoke.js
      - name: Verify SKAI episode-page framing policy
        run: |
          python3 - <<'PY'
          import urllib.request
          u='https://www.skai.gr/tv/episode/seires/mple-ores/2026-09-14-21/mple-ores-epeisodio-1-14092026'
          try:
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=13) as r:
              print('SKAI episode HTTP',r.status)
              print('X-Frame-Options:',r.headers.get('X-Frame-Options','(not advertised)'))
              csp=r.headers.get('Content-Security-Policy','')
              print('CSP frame-ancestors:',next((part.strip() for part in csp.split(';') if 'frame-ancestors' in part),'(not advertised)'))
          except Exception as e:print('SKAI network verification unavailable:',str(e)[:150])
          PY
