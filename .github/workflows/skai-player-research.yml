name: Verify Greek One signed release
on:
  pull_request:
    paths:
      - '.github/workflows/skai-player-research.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production Build 70 release
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base='https://api.github.com/repos/NikitaAttendSure/Greek-TV-Australia'
          def get(path):
            req=urllib.request.Request(base+path,headers={'Accept':'application/vnd.github+json','User-Agent':'GreekOneReleaseAudit/1.0'})
            with urllib.request.urlopen(req,timeout=15) as r:return json.load(r)
          branch=get('/branches/main')
          print('MAIN_SHA',branch['commit']['sha'])
          runs=get('/actions/runs?branch=main&per_page=5')
          for x in runs['workflow_runs'][:5]:
            print('RUN',x['id'],x['name'],x['head_sha'],x['status'],x['conclusion'])
          release=get('/releases/tags/reskakis-tv-latest')
          for a in release['assets']:
            print('RELEASE_ASSET',a['name'],'updated',a['updated_at'],'size',a['size'],'download',a['browser_download_url'])
          PY
