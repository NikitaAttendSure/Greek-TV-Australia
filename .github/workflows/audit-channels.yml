name: Audit Greek TV channels
on:
  workflow_dispatch:
  push:
    paths:
      - "greek-tv.m3u"
      - "tools/audit_channels.py"
      - ".github/workflows/audit-channels.yml"
  schedule:
    - cron: "20 18 * * 0"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit all playlist streams
        run: python tools/audit_channels.py
      - name: Add summary
        run: cat channel-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: greek-one-channel-audit
          path: |
            channel-audit.json
            channel-audit.md
          retention-days: 14
