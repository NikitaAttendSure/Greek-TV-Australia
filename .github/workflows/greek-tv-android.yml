name: Build Greek TV APK
on:
  pull_request:
    paths:
      - 'tv-app/**'
      - '.github/workflows/greek-tv-android.yml'
  push:
    paths:
      - 'tv-app/**'
      - '.github/workflows/greek-tv-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Greek-TV-debug
          path: |
            tv-app/app/build/outputs/apk/debug/app-debug.apk
            tv-app/app/build/outputs/bundle/release/app-release.aab
      - name: Publish permanent RESKAKIS TV APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view reskakis-tv-latest >/dev/null 2>&1; then
            gh release create reskakis-tv-latest --title "RESKAKIS TV" --notes "Latest Sony / Google TV family build."
          fi
          cp tv-app/app/build/outputs/apk/debug/app-debug.apk RESKAKIS-TV.apk
          gh release upload reskakis-tv-latest RESKAKIS-TV.apk --clobber
